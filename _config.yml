title: "Autarcas do Livre"
description: "Eleitos e eleitas do Livre nas autarquias locais de Portugal"
baseurl: ""
url: "https://autarcas-lisboa-livre.metade.org"
lang: pt

# Collections
collections:
  pages:
    output: true
  municipios:
    output: true
    permalink: /municipios/:slug/
  autarcas:
    output: true
    permalink: /autarcas/:slug/
  freguesias:
    output: true
    permalink: /municipios/:municipio/freguesias/:slug/
  propostas:
    output: true
    permalink: /municipios/:municipio/propostas/:freguesia/:slug/
  tags:
    output: false
  locations:
    output: false

defaults:
  - scope:
      path: ""
      type: municipios
    values:
      layout: municipio
  - scope:
      path: ""
      type: autarcas
    values:
      layout: autarca
  - scope:
      path: ""
      type: freguesias
    values:
      layout: freguesia
  - scope:
      path: ""
      type: propostas
    values:
      layout: proposta
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Per-organ propostas defaults — auto-set municipio + freguesia from folder path
  - scope: { path: "_propostas/lisboa/camara-municipal", type: propostas }
    values: { municipio: lisboa, freguesia: camara-municipal }
  - scope: { path: "_propostas/lisboa/assembleia-municipal", type: propostas }
    values: { municipio: lisboa, freguesia: assembleia-municipal }
  - scope: { path: "_propostas/lisboa/alvalade", type: propostas }
    values: { municipio: lisboa, freguesia: alvalade }
  - scope: { path: "_propostas/lisboa/areeiro", type: propostas }
    values: { municipio: lisboa, freguesia: areeiro }
  - scope: { path: "_propostas/lisboa/arroios", type: propostas }
    values: { municipio: lisboa, freguesia: arroios }
  - scope: { path: "_propostas/lisboa/avenidas-novas", type: propostas }
    values: { municipio: lisboa, freguesia: avenidas-novas }
  - scope: { path: "_propostas/lisboa/lumiar", type: propostas }
    values: { municipio: lisboa, freguesia: lumiar }
  - scope: { path: "_propostas/lisboa/parque-das-nacoes", type: propostas }
    values: { municipio: lisboa, freguesia: parque-das-nacoes }
  - scope: { path: "_propostas/lisboa/penha-de-franca", type: propostas }
    values: { municipio: lisboa, freguesia: penha-de-franca }
  - scope: { path: "_propostas/lisboa/santo-antonio", type: propostas }
    values: { municipio: lisboa, freguesia: santo-antonio }
  - scope: { path: "_propostas/lisboa/sao-domingos-de-benfica", type: propostas }
    values: { municipio: lisboa, freguesia: sao-domingos-de-benfica }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - Gemfile
  - Gemfile.lock
  - README.md
