title: "Autarcas de Lisboa – Livre"
description: "Eleitos e eleitas do Livre na Câmara Municipal, Assembleia Municipal e Juntas de Freguesia de Lisboa"
baseurl: ""
url: "https://autarcas-lisboa-livre.metade.org"
lang: pt

# Collections
collections:
  pages:
    output: true
  autarcas:
    output: true
    permalink: /autarcas/:slug/
  juntas:
    output: true
    permalink: /juntas/:slug/
  propostas:
    output: true
    permalink: /propostas/:path/
  tags:
    output: false
  locations:
    output: false

defaults:
  - scope:
      path: ""
      type: autarcas
    values:
      layout: autarca
  - scope:
      path: ""
      type: juntas
    values:
      layout: junta
  - scope:
      path: ""
      type: propostas
    values:
      layout: proposta
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Per-organ junta defaults (auto-set front matter so Liquid filters work without editors filling it in)
  - scope: { path: "_propostas/camara-municipal", type: propostas }
    values: { junta: camara-municipal }
  - scope: { path: "_propostas/assembleia-municipal", type: propostas }
    values: { junta: assembleia-municipal }
  - scope: { path: "_propostas/alvalade", type: propostas }
    values: { junta: alvalade }
  - scope: { path: "_propostas/areeiro", type: propostas }
    values: { junta: areeiro }
  - scope: { path: "_propostas/arroios", type: propostas }
    values: { junta: arroios }
  - scope: { path: "_propostas/avenidas-novas", type: propostas }
    values: { junta: avenidas-novas }
  - scope: { path: "_propostas/lumiar", type: propostas }
    values: { junta: lumiar }
  - scope: { path: "_propostas/parque-das-nacoes", type: propostas }
    values: { junta: parque-das-nacoes }
  - scope: { path: "_propostas/penha-de-franca", type: propostas }
    values: { junta: penha-de-franca }
  - scope: { path: "_propostas/santo-antonio", type: propostas }
    values: { junta: santo-antonio }
  - scope: { path: "_propostas/sao-domingos-de-benfica", type: propostas }
    values: { junta: sao-domingos-de-benfica }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - Gemfile
  - Gemfile.lock
  - README.md
