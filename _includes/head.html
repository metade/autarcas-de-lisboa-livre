<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>
    {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{
    site.title }}{% endif %}
</title>
<meta
    name="description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
/>

    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
/>
<link rel="stylesheet" href="{{ '/assets/css/main.min.css' | relative_url }}" />

    src="https://static.cloudflareinsights.com/beacon.min.js"
