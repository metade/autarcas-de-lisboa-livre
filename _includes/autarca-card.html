{% assign autarca = include.autarca %}
<a href="{{ autarca.url | relative_url }}" class="group block bg-white rounded-xl border border-gray-200 hover:border-livre-green hover:shadow-md transition-all overflow-hidden">
  <div class="aspect-square bg-livre-green-light overflow-hidden">
    {% if autarca.foto != "" %}
      <img src="{{ autarca.foto | relative_url }}" alt="Fotografia de {{ autarca.nome }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
    {% else %}
      <div class="w-full h-full relative bg-stone-50">
        <div class="absolute h-full top-0 left-[5%] w-[55%] rounded-r-full" style="background: #bdd600; mix-blend-mode: multiply;"></div>
        <div class="absolute h-full top-0 right-[5%] w-[55%] rounded-l-full" style="background: #00b4ed; mix-blend-mode: multiply;"></div>
      </div>
    {% endif %}
  </div>
  <div class="p-4">
    <p class="font-semibold text-gray-900 group-hover:text-livre-green transition-colors">{{ autarca.nome }}</p>
    {% if autarca.cargos %}
      {% for cargo in autarca.cargos %}
        <p class="text-xs text-gray-500 mt-0.5">{{ cargo.cargo }}</p>
      {% endfor %}
    {% endif %}
  </div>
</a>
