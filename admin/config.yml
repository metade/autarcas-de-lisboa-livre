backend:
  name: github
  repo: metade/autarcas-de-lisboa-livre
  branch: main
  base_url: https://autarcas-de-lisboa-cms-auth.metade.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: pt

collections:

  # ── MUNICÍPIOS ─────────────────────────────────────────────────────────────
  - name: municipios
    label: Municípios
    label_singular: Município
    folder: _municipios
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    fields:
      - label: Nome
        name: nome
        widget: string

      - label: Slug (identificador único, ex. "porto")
        name: slug
        widget: string

      - label: Distrito
        name: distrito
        widget: string

      - label: Descrição
        name: descricao
        widget: markdown
        required: false

      - label: Website oficial
        name: website_oficial
        widget: string
        required: false
        default: ""

      - label: Facebook (URL completo)
        name: facebook
        widget: string
        required: false
        default: ""

      - label: X / Twitter (URL completo)
        name: x
        widget: string
        required: false
        default: ""

      - label: Instagram (URL completo)
        name: instagram
        widget: string
        required: false
        default: ""

      - label: YouTube (URL completo)
        name: youtube
        widget: string
        required: false
        default: ""

  # ── AUTARCAS ──────────────────────────────────────────────────────────────
  - name: autarcas
    label: Autarcas
    label_singular: Autarca
    folder: _autarcas
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    media_folder: "/assets/images/autarcas"
    public_folder: "/assets/images/autarcas"
    fields:
      - label: Nome completo
        name: nome
        widget: string

      - label: Fotografia
        name: foto
        widget: image
        required: false
        default: ""

      - label: Ativo
        name: ativo
        widget: boolean
        default: true

      - label: Início de mandato
        name: mandato_inicio
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        required: false

      - label: Biografia
        name: biografia
        widget: markdown
        required: false

      - label: Email de contacto
        name: contacto_email
        widget: string
        required: false
        default: ""

      - label: Twitter / X (só o @, sem o @)
        name: contacto_twitter
        widget: string
        required: false
        default: ""

      - label: Instagram (só o @, sem o @)
        name: contacto_instagram
        widget: string
        required: false
        default: ""

      - label: LinkedIn (URL completo)
        name: contacto_linkedin
        widget: string
        required: false
        default: ""
        pattern: ['^$|^https://www\.linkedin\.com/', 'Deve ser um URL do LinkedIn (ex. https://www.linkedin.com/in/nome)']

      - label: Bluesky (só o @, sem o @)
        name: contacto_bluesky
        widget: string
        required: false
        default: ""
        pattern: ['^$|^[a-zA-Z0-9._-]+$', 'Apenas o identificador, sem @ (ex. nome.bsky.social)']

      - label: Facebook (URL completo)
        name: contacto_facebook
        widget: string
        required: false
        default: ""
        pattern: ['^$|^https://www\.facebook\.com/', 'Deve ser um URL do Facebook (ex. https://www.facebook.com/nome)']

      - label: Género gramatical
        name: genero
        widget: select
        options:
          - { label: "Masculino", value: "m" }
          - { label: "Feminino", value: "f" }
          - { label: "Neutro / Não-binário", value: "n" }
        default: m

      - label: Cargos
        name: cargos
        widget: list
        fields:
          - label: Cargo
            name: cargo
            widget: select
            options:
              - label: "Vereador/a (Câmara Municipal)"
                value: "Vereador/a"
              - label: "Deputado/a Municipal (Assembleia Municipal)"
                value: "Deputado/a Municipal"
              - label: "Membro de Assembleia"
                value: "Membro de Assembleia"
              - label: "Vogal do Executivo"
                value: "Vogal do Executivo"
              - label: "Primeiro/a Secretário/a"
                value: "Primeiro/a Secretário/a"
          - label: Órgão (nome completo, ex. "Assembleia de Freguesia de Arroios")
            name: orgao
            widget: string
          - label: Município
            name: municipio
            widget: relation
            collection: municipios
            display_fields: [nome]
            search_fields: [nome]
            value_field: slug
          - label: Freguesia / Órgão
            name: freguesia
            widget: relation
            collection: freguesias
            display_fields: [nome]
            search_fields: [nome]
            value_field: slug
            hint: "Para câmara-municipal e assembleia-municipal, editar o ficheiro directamente."
          - label: Temporariamente ausente
            name: ausente_temporariamente
            widget: boolean
            default: false
            required: false
          - label: Cargo temporário (substituição)
            name: temporario
            widget: boolean
            default: false
            required: false
          - label: Substitui
            name: substitui
            widget: relation
            collection: autarcas
            display_fields: [nome]
            search_fields: [nome]
            value_field: "{{slug}}"
            required: false
          - label: Substituído/a por
            name: substituido_por
            widget: relation
            collection: autarcas
            display_fields: [nome]
            search_fields: [nome]
            value_field: "{{slug}}"
            required: false

      - label: Texto adicional (bio alargada)
        name: body
        widget: markdown
        required: false

  # ── LOCALIZAÇÕES ───────────────────────────────────────────────────────────
  - name: locations
    label: Localizações
    label_singular: Localização
    folder: _locations
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    fields:
      - label: Nome
        name: nome
        widget: string
      - label: Freguesia
        name: freguesia
        widget: relation
        collection: freguesias
        display_fields: [nome]
        search_fields: [nome]
        value_field: slug

  # ── ETIQUETAS ──────────────────────────────────────────────────────────────
  - name: tags
    label: Etiquetas
    label_singular: Etiqueta
    folder: _tags
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    fields:
      - label: Nome
        name: nome
        widget: string

  # ── FREGUESIAS ─────────────────────────────────────────────────────────────
  - name: freguesias
    label: Assembleias de Freguesia
    label_singular: Assembleia de Freguesia
    folder: _freguesias
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    fields:
      - label: Nome
        name: nome
        widget: string

      - label: Slug (identificador único, ex. "avenidas-novas")
        name: slug
        widget: string

      - label: Município
        name: municipio
        widget: relation
        collection: municipios
        display_fields: [nome]
        search_fields: [nome]
        value_field: slug

      - label: Tipo de órgão
        name: tipo
        widget: select
        options:
          - Assembleia de Freguesia
        default: Assembleia de Freguesia

      - label: Descrição
        name: descricao
        widget: markdown
        required: false

      - label: Website oficial
        name: website_oficial
        widget: string
        required: false
        default: ""

      - label: Facebook (URL completo)
        name: facebook
        widget: string
        required: false
        default: ""

      - label: X / Twitter (URL completo)
        name: x
        widget: string
        required: false
        default: ""

      - label: Instagram (URL completo)
        name: instagram
        widget: string
        required: false
        default: ""

      - label: YouTube (URL completo)
        name: youtube
        widget: string
        required: false
        default: ""

      - label: Fotografia / Imagem
        name: foto_junta
        widget: image
        required: false
        default: ""

      - label: Texto adicional
        name: body
        widget: markdown
        required: false

  # ── PROPOSTAS / MOÇÕES ─────────────────────────────────────────────────────
  # Single collection for all municipalities. Uses path template to place files
  # in _propostas/{municipio}/{freguesia}/{year}-{slug}.md automatically.
  # The municipio and freguesia front matter fields are set by the editor via dropdowns.

  - name: propostas
    label: Propostas
    label_singular: Proposta
    folder: _propostas
    path: "{{municipio}}/{{freguesia}}/{{year}}-{{slug}}"
    create: true
    slug: "{{year}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{data}})"
    editor:
      preview: false
    fields:
      - label: Município
        name: municipio
        widget: relation
        collection: municipios
        display_fields: [nome]
        search_fields: [nome]
        value_field: slug

      - label: Órgão / Freguesia
        name: freguesia
        widget: relation
        collection: freguesias
        display_fields: [nome]
        search_fields: [nome]
        value_field: slug
        hint: "Para câmara-municipal e assembleia-municipal, editar o ficheiro directamente."

      - { label: Título, name: title, widget: string }

      - label: Tipo
        name: tipo
        widget: select
        options: [Proposta, Moção, Requerimento, Voto]
        default: Proposta

      - { label: Data, name: data, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }

      - label: Autores / Signatários
        name: autarcas
        widget: relation
        collection: autarcas
        display_fields: [nome]
        search_fields: [nome]
        value_field: "{{slug}}"
        multiple: true

      - label: Estado
        name: estado
        widget: select
        options: [Em análise, Aprovada, Rejeitada, Retirada]
        default: Em análise

      - { label: Resumo (para listagens), name: resumo, widget: text, required: false }
      - { label: Documento (PDF), name: documento_url, widget: file, required: false, default: "" }

      - label: Etiquetas
        name: tags
        widget: relation
        collection: tags
        display_fields: [nome]
        search_fields: [nome]
        value_field: nome
        multiple: true
        required: false

      - label: Localizações
        name: localizacoes
        widget: relation
        collection: locations
        display_fields: [nome]
        search_fields: [nome]
        value_field: nome
        multiple: true
        required: false

      - &votacao_field
        label: Resultado da votação
        name: votacao
        widget: object
        required: false
        collapsed: true
        fields:
          - label: A favor
            name: a_favor
            widget: object
            required: false
            collapsed: false
            fields:
              - { label: Votos, name: votos, widget: number, value_type: int, required: false }
              - { label: Partidos, name: partidos, widget: string, required: false, default: "", hint: "Ex. L/CDU/PAN/BE" }
          - label: Contra
            name: contra
            widget: object
            required: false
            collapsed: false
            fields:
              - { label: Votos, name: votos, widget: number, value_type: int, required: false }
              - { label: Partidos, name: partidos, widget: string, required: false, default: "" }
          - label: Abstenções
            name: abstencoes
            widget: object
            required: false
            collapsed: false
            fields:
              - { label: Votos, name: votos, widget: number, value_type: int, required: false }
              - { label: Partidos, name: partidos, widget: string, required: false, default: "" }
          - label: Votação por pontos
            name: pontos
            widget: list
            required: false
            collapsed: true
            label_singular: Ponto
            fields:
              - { label: Descrição, name: descricao, widget: string, hint: "Ex. Ponto 1, Ponto 4, Moção final. Deixar Contra e Abstenções em branco para registar unanimidade." }
              - label: A favor
                name: a_favor
                widget: object
                required: false
                collapsed: false
                fields:
                  - { label: Votos, name: votos, widget: number, value_type: int, required: false }
                  - { label: Partidos, name: partidos, widget: string, required: false, default: "" }
              - label: Contra
                name: contra
                widget: object
                required: false
                collapsed: false
                fields:
                  - { label: Votos, name: votos, widget: number, value_type: int, required: false }
                  - { label: Partidos, name: partidos, widget: string, required: false, default: "" }
              - label: Abstenções
                name: abstencoes
                widget: object
                required: false
                collapsed: false
                fields:
                  - { label: Votos, name: votos, widget: number, value_type: int, required: false }
                  - { label: Partidos, name: partidos, widget: string, required: false, default: "" }

      - { label: Texto completo, name: body, widget: markdown }

  # ── PÁGINAS ESTÁTICAS ──────────────────────────────────────────────────────
  - name: pages
    label: Páginas
    files:
      - label: Câmara Municipal (Lisboa)
        name: camara_municipal_lisboa
        file: _pages/camara-municipal.md
        fields:
          - { label: Nome, name: nome, widget: string }
          - { label: Descrição, name: descricao, widget: markdown, required: false }
          - { label: Website oficial, name: website_oficial, widget: string, required: false }
          - { label: "Facebook (URL completo)", name: facebook, widget: string, required: false, default: "" }
          - { label: "X / Twitter (URL completo)", name: x, widget: string, required: false, default: "" }
          - { label: "Instagram (URL completo)", name: instagram, widget: string, required: false, default: "" }
          - { label: "YouTube (URL completo)", name: youtube, widget: string, required: false, default: "" }
          - { label: Fotografia, name: foto_junta, widget: image, required: false }

      - label: Assembleia Municipal (Lisboa)
        name: assembleia_municipal_lisboa
        file: _pages/assembleia-municipal.md
        fields:
          - { label: Nome, name: nome, widget: string }
          - { label: Descrição, name: descricao, widget: markdown, required: false }
          - { label: Website oficial, name: website_oficial, widget: string, required: false }
          - { label: "Facebook (URL completo)", name: facebook, widget: string, required: false, default: "" }
          - { label: "X / Twitter (URL completo)", name: x, widget: string, required: false, default: "" }
          - { label: "Instagram (URL completo)", name: instagram, widget: string, required: false, default: "" }
          - { label: "YouTube (URL completo)", name: youtube, widget: string, required: false, default: "" }
          - { label: Fotografia, name: foto_junta, widget: image, required: false }

      - label: Sobre
        name: sobre
        file: _pages/sobre.md
        fields:
          - { label: Conteúdo, name: body, widget: markdown }
